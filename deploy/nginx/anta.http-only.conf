# Phase d'amorçage (avant le certificat Let's Encrypt) : sert Anta en HTTP et
# répond au challenge ACME. Remplacer par anta.conf dès le certificat obtenu.
# Mêmes règles que anta.conf (résolution paresseuse obligatoire).

server {
    listen 80;
    server_name anta.peraha.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 110m;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $anta_upstream http://anta-app:3333;

    location / {
        proxy_pass $anta_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }
}
