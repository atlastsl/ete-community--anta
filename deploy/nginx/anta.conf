# Vhost d'Anta dans le nginx de Coffee Chat (Story 8.3, docs/staging-vps.md).
# À copier dans /srv/coffeechat/infra/nginx/conf.d/anta.conf sur le VPS de staging,
# puis : docker exec coffeechat-nginx-1 nginx -t && docker exec coffeechat-nginx-1 nginx -s reload
#
# Résolution paresseuse (resolver + variable) : nginx démarre même si Anta est
# arrêté (502 sur anta.peraha.com) au lieu de refuser de démarrer et de couper
# Coffee Chat. Ne jamais remplacer par un bloc `upstream` ni un proxy_pass statique.

server {
    listen 80;
    server_name anta.peraha.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name anta.peraha.com;
    http2 on;

    ssl_certificate     /etc/letsencrypt/live/anta.peraha.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anta.peraha.com/privkey.pem;

    # Parité avec `bodyparser` (limit: '110mb') ; la limite globale de Coffee Chat est 10M.
    client_max_body_size 110m;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $anta_upstream http://anta-app:3333;

    location / {
        proxy_pass $anta_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }
}
